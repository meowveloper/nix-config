# MangoWM Configuration

# Source
source=~/.config/mango/noctalia.conf
source=~/.config/mango/layout.conf
source=~/.config/mango/visuals.conf
source=~/.config/mango/bindings.conf

# Startup
exec_once=bash  ~/.config/mango/start-up.sh

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller

layer_rule=no_blur:1,layer_name:selection
layer_rule=no_blur:1,layer_name:noctalia-notifications
layer_rule=no_blur:1,layer_name:noctalia-toast

window_rule=focused_opacity:0.8,unfocused_opacity:0.8,app_id:dev.zed.Zed
window_rule=no_blur:1,app_id:com.mitchellh.ghostty
window_rule=no_blur:1,app_id:ghostty
# window_rule=focused_opacity:0.8,unfocused_opacity:0.8,app_id:md.obsidian.Obsidian
# window_rule=no_blur:1,app_id:md.obsidian.Obsidian

source=~/.config/mango/noctalia.conf
