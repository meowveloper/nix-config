ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    # Responses-protocol models (https://opencode.ai/zen/go/v1/responses).
    # Route id kept so the current default model + running sessions keep working.
    opencode-cus:
      displayName: opencode-cus
      apiKeyEnv: OPENCODE_CUS_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/go/v1
      models:
        - id: muse-spark-1.3-contributor
          name: Muse Spark 1.3 Contributor
          contextWindow: 1048576
          maxTokens: 131072
        - id: muse-spark-1.2-contributor
          name: Muse Spark 1.2 Contributor
          contextWindow: 1048576
          maxTokens: 131072
    # Chat-completions models (https://opencode.ai/zen/go/v1/chat/completions).
    # Previously these were forced onto openai-responses — wrong protocol.
    # compat block copied from pi-ai's own opencode-go catalog DeepSeek entries.
    opencode-go-chat:
      displayName: OpenCode Go Chat
      apiKeyEnv: OPENCODE_CUS_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/go/v1
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        requiresReasoningContentOnAssistantMessages: true
        thinkingFormat: deepseek
      # Explicit fallback for models with no verified window (deepseek-flash).
      defaultContextWindow: 1048576
      defaultMaxTokens: 131072
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision Exp
          contextWindow: 1048576
          maxTokens: 131072
        # Window unverified (not in pi-ai catalogs or OpenRouter) —
        # serves route defaults above until confirmed.
        - id: deepseek-flash
agent-default-model:
  provider: opencode-cus
  model: muse-spark-1.3-contributor
ui-conversation:
  busyEnter: steer
